# Test-only overrides.
#
# The main configuration deliberately gives ORSZEM_DB_USERNAME / ORSZEM_DB_PASSWORD no
# defaults, so a misconfigured deployment fails loudly. Tests must not depend on the
# developer's environment, so placeholder values are supplied here; the actual connection
# is provided by the Testcontainers @ServiceConnection bean, which takes precedence.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/unused
    username: test
    password: test

# The Public-submission limiter stays ENABLED in every integration test, so each existing
# submission test still runs through it. Its burst is simply huge here, because the whole suite
# shares one loopback source and many tests submit far more than ten reports. The dedicated
# PublicSubmissionRateLimitIT overrides these to the production values and proves the limit.
orszem:
  public-submission-rate-limit:
    enabled: true
    burst: 1000000
    refill-period: 1s
