spring:
  application:
    name: orszem-backend

  datasource:
    # Every value comes from the environment. The URL has a development-friendly
    # default; the credentials deliberately have none, so a misconfigured deployment
    # fails loudly at startup instead of silently reaching the wrong database.
    url: ${ORSZEM_DB_URL:jdbc:postgresql://localhost:5432/orszem_v2}
    username: ${ORSZEM_DB_USERNAME}
    password: ${ORSZEM_DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    # Destructive schema drops are never available, in any environment.
    clean-disabled: true

server:
  # Bind to loopback by default: the public edge is Caddy, never Spring Boot itself.
  address: ${ORSZEM_BIND_ADDRESS:127.0.0.1}
  port: ${ORSZEM_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Health only. No env, beans, mappings, configprops, loggers or heapdump.
        include: health
  endpoint:
    health:
      # Never reveal component status, disk paths or datasource detail publicly.
      show-details: never
      show-components: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

orszem:
  api:
    name: orszem-backend
    version: v1

  # --- Authentication -------------------------------------------------------
  # Short access tokens are affordable here: tokens are opaque and revalidated against
  # the database on every request, so revocation takes effect immediately.
  auth:
    access-token-lifetime: ${ORSZEM_ACCESS_TOKEN_LIFETIME:15m}
    # Absolute session lifetime. Refresh rotation never extends beyond this.
    session-lifetime: ${ORSZEM_SESSION_LIFETIME:30d}
    # Peers whose X-Forwarded-For may be believed. Loopback only, matching the
    # deployment: Spring binds 127.0.0.1 and Caddy on the same host is the sole ingress.
    # Widen only if a proxy moves to another machine, and never to a range that could
    # contain a client - the header is client-supplied and only means anything when a
    # trusted proxy wrote it.
    trusted-proxies: ${ORSZEM_TRUSTED_PROXIES:127.0.0.1/32,::1/128}

    rate-limit:
      enabled: ${ORSZEM_RATE_LIMIT_ENABLED:true}
      # Provisional pilot values, deliberately conservative and expected to be tuned
      # once there is real traffic to measure. Counters are in-memory and reset when
      # the backend restarts - acceptable for a single-server pilot.
      per-service-id-attempts: ${ORSZEM_RATE_LIMIT_SERVICE_ID_ATTEMPTS:10}
      per-ip-attempts: ${ORSZEM_RATE_LIMIT_IP_ATTEMPTS:40}
      window: ${ORSZEM_RATE_LIMIT_WINDOW:15m}
      retry-after: ${ORSZEM_RATE_LIMIT_RETRY_AFTER:1m}
      maximum-tracked-keys: ${ORSZEM_RATE_LIMIT_MAX_KEYS:100000}

logging:
  level:
    root: INFO
    hu.orszembejelento: INFO
    org.flywaydb: INFO
    # Spring Security at DEBUG would print filter chains and principal details on every
    # request; kept at INFO so nothing about credentials reaches the log.
    org.springframework.security: INFO
