org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The only SDK platform installed on the reference machine is API 37 (Android 17);
# the build targets API 35, so silence the "compileSdk not tested" guard for 37
# if a module ever needs it. API 35 is the actual compile/target SDK.
android.suppressUnsupportedCompileSdk=37
