name: v2.0.7 release artifacts

on:
  push:
    branches:
      - release-artifacts/v2.0.7

permissions:
  contents: read

concurrency:
  group: v2.0.7-release-artifacts
  cancel-in-progress: false

env:
  TARGET_SHA: 034eb0a35ca0afb68932f6cd14f62b0edced0e34

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          path: source-a

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ' '

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "platform-tools"

      - name: Create the independent second worktree
        run: git -C source-a worktree add --detach "$RUNNER_TEMP/source-b" "$TARGET_SHA"

      - name: Build backend and unsigned Service APK twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          (
            cd source-a/backend
            ./gradlew clean bootJar --no-build-cache --no-daemon
          )
          (
            cd source-a/android
            ./gradlew :service-app:clean :service-app:assembleRelease --no-build-cache --no-daemon
          )

          (
            cd "$RUNNER_TEMP/source-b/backend"
            ./gradlew clean bootJar --no-build-cache --no-daemon
          )
          (
            cd "$RUNNER_TEMP/source-b/android"
            ./gradlew :service-app:clean :service-app:assembleRelease --no-build-cache --no-daemon
          )

          cp source-a/backend/build/libs/backend.jar release/backend-2.0.7.jar
          cp source-a/android/service-app/build/outputs/apk/release/service-app-release-unsigned.apk \
            release/service-app-release-2.0.7-UNSIGNED.apk

          cmp source-a/backend/build/libs/backend.jar \
            "$RUNNER_TEMP/source-b/backend/build/libs/backend.jar"
          cmp source-a/android/service-app/build/outputs/apk/release/service-app-release-unsigned.apk \
            "$RUNNER_TEMP/source-b/android/service-app/build/outputs/apk/release/service-app-release-unsigned.apk"

      - name: Verify artifact identity and unsigned boundary
        shell: bash
        run: |
          set -euo pipefail
          JAR=release/backend-2.0.7.jar
          APK=release/service-app-release-2.0.7-UNSIGNED.apk
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"

          test -n "$AAPT2"
          test -n "$APKSIGNER"
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -F 'Implementation-Version: 2.0.7'
          "$AAPT2" dump badging "$APK" | tee release/service-app-badging.txt
          grep -F "package: name='hu.orszembejelento.service' versionCode='8' versionName='2.0.7'" \
            release/service-app-badging.txt

          if "$APKSIGNER" verify --verbose --print-certs "$APK"; then
            echo 'ERROR: Service APK was unexpectedly signed.' >&2
            exit 1
          fi
          test ! -e "$APK.idsig"

          {
            echo "target_sha=$TARGET_SHA"
            echo "workflow_commit=$GITHUB_SHA"
            java -version 2>&1 | head -1
            source-a/backend/gradlew --version | sed -n '1,12p'
            echo
            echo 'Artifacts (both independent builds were byte-identical):'
            sha256sum "$JAR" "$APK"
          } > release/SHA256SUMS-build-provenance.txt

      - name: Upload verified release candidates
        uses: actions/upload-artifact@v4
        with:
          name: v2.0.7-release-candidates-034eb0a
          path: |
            release/backend-2.0.7.jar
            release/service-app-release-2.0.7-UNSIGNED.apk
            release/SHA256SUMS-build-provenance.txt
            release/service-app-badging.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
