name: backend

# No path filters. Demo v1 filtered by path, which meant a root-level or infrastructure
# change ran no CI at all. Running all three pipelines on every push is simpler and honest.
on:
  # Every branch. Push-triggered runs attach to the head commit, so they appear as
  # checks on a pull request too - one run per commit instead of two. Add
  # `pull_request:` if outside contributors ever open PRs from forks.
  push:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs unit tests plus the Testcontainers integration tests against a real
      # PostgreSQL. GitHub-hosted runners provide Docker, so this is not skipped.
      - name: Build and test
        working-directory: backend
        run: ./gradlew build --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
