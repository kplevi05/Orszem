name: deploy-config

on:
  # Both triggers on purpose. Push covers branches before a PR is opened; pull_request
  # independently verifies every PR, including PRs from forks, which a push trigger in
  # this repository never sees.
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Caddy
        env:
          CADDY_VERSION: 2.11.4
        run: |
          curl -fsSL -o caddy.tar.gz \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          tar -xzf caddy.tar.gz caddy
          sudo install -m 0755 caddy /usr/local/bin/caddy
          caddy version

      # `caddy validate` provisions the config, which includes opening the file loggers,
      # so the log directory the Caddyfile names must exist and be writable first. On the
      # server the runbook creates it; here the runner has to.
      - name: Create Caddy log directory
        run: sudo mkdir -p /var/log/caddy && sudo chown "$USER" /var/log/caddy

      - name: Validate Caddyfile
        run: caddy validate --config deploy/caddy/Caddyfile --adapter caddyfile

      # `caddy fmt --diff` is informational and always exits 0, so it cannot gate.
      # Comparing the formatted output against the file does.
      - name: Check Caddyfile is formatted
        run: caddy fmt deploy/caddy/Caddyfile | diff -u deploy/caddy/Caddyfile -

      # Runs the real Caddyfile against a stub upstream and asserts that only the
      # intended /api/* surface is publicly routed - actuator, the OpenAPI document and
      # Swagger UI must stay unreachable through the edge, on every host.
      - name: Verify public routing policy
        run: ./scripts/verify-caddy-routing.sh

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Runs the real Caddyfile against a stub upstream and a real request carrying
      # sentinel header values, and asserts X-Orszem-Report-Access (a live Public report
      # credential, ADR 0008) and Authorization never appear in the access log - plus a
      # negative control proving the check would actually catch the redaction rule being
      # removed. See scripts/verify-caddy-header-redaction.sh's own header for detail.
      - name: Verify access-log header redaction
        run: ./scripts/verify-caddy-header-redaction.sh

      # The CSP/Permissions-Policy check below serves the REAL built Public Web bundle
      # through the real Caddyfile, so it needs an actual dist/ to exist first.
      - name: Install Public Web dependencies
        working-directory: web/public-web
        run: npm ci

      - name: Build Public Web
        working-directory: web/public-web
        run: npm run build

      # Serves the real built web/public-web/dist through the real Caddyfile and asserts
      # the Content-Security-Policy and Permissions-Policy headers on the served page - a
      # live-browser check (loading the page and confirming no CSP violation appears in the
      # console) was additionally performed manually for this phase; see
      # scripts/verify-caddy-csp.sh's own header and PHASE_5_ENGINEERING_REPORT.md.
      - name: Verify Public Web CSP and Permissions-Policy
        run: ./scripts/verify-caddy-csp.sh

      - name: Ensure no secret material is committed under deploy/
        run: |
          if git ls-files deploy | grep -qiE '\.(jks|keystore|p12|pem|key)$|(^|/)\.env$'; then
            echo "secret-shaped file committed under deploy/"; exit 1
          fi
          if grep -rIqE '(password|secret|token)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9!@#$%^&*_+-]{8,}' \
               deploy --exclude='*.example'; then
            echo "possible credential committed under deploy/"; exit 1
          fi
          echo "deploy/ carries no secret material"

  backup-restore-scripts:
    # Phase 14. CI never touches production, restores a database, or generates a signing
    # key (see the "CI" section of docs/PHASE_14_ENGINEERING_REPORT.md) - everything here
    # runs against throwaway resources this job creates and destroys itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A script that is readable but not executable fails with "Permission denied" the
      # first time anyone actually runs it - caught here directly, rather than only when
      # a later step tries to invoke one. Windows checkouts in particular can silently
      # drop the executable bit (core.fileMode=false is the common default there), so this
      # checks the bit Git actually recorded, not the working tree's local permissions.
      - name: Every deployment script is executable
        run: |
          fail=0
          for f in scripts/orszem-backup.sh scripts/orszem-restore.sh \
                   scripts/orszem-preflight.sh scripts/orszem-backup-age-check.sh \
                   scripts/orszem-restore-drill.sh; do
            mode="$(git ls-files -s "$f" | cut -d' ' -f1)"
            case "$mode" in
              100755) echo "OK: $f ($mode)" ;;
              *) echo "NOT EXECUTABLE in git: $f ($mode)"; fail=1 ;;
            esac
          done
          exit $fail

      - name: Syntax-check every deployment script
        run: |
          for f in scripts/orszem-backup.sh scripts/orszem-restore.sh \
                   scripts/orszem-preflight.sh scripts/orszem-backup-age-check.sh \
                   scripts/orszem-restore-drill.sh; do
            echo "-- $f --"
            bash -n "$f"
          done

      # Static safety checks (§76): no script may default to a production-shaped target,
      # and every one must fail safely - non-zero, no output implying success - when
      # called with no arguments at all.
      - name: No hard-coded production target in the backup/restore scripts
        run: |
          if grep -nE 'orszembejelento\.hu|129\.159\.31\.175' \
               scripts/orszem-backup.sh scripts/orszem-restore.sh \
               scripts/orszem-preflight.sh scripts/orszem-backup-age-check.sh \
               scripts/orszem-restore-drill.sh; then
            echo "a deployment script names a real environment - it must not"; exit 1
          fi
          echo "OK: no production-shaped hostname in any deployment script"

      - name: Safe missing-argument behaviour
        run: |
          set +e
          fail=0
          ./scripts/orszem-backup.sh; [ $? -ge 1 ] || { echo "backup: accepted no args"; fail=1; }
          ./scripts/orszem-restore.sh; [ $? -ge 1 ] || { echo "restore: accepted no args"; fail=1; }
          ./scripts/orszem-preflight.sh /nonexistent-on-purpose.env; [ $? -ge 1 ] || { echo "preflight: accepted a missing file"; fail=1; }
          ./scripts/orszem-backup-age-check.sh; [ $? -ge 1 ] || { echo "backup-age-check: accepted no args"; fail=1; }
          exit $fail

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the backend jar for the drill
        working-directory: backend
        run: ./gradlew bootJar --no-daemon

      # The real end-to-end proof: empty-DB bootstrap, a real fixture row, a real Public
      # report and its capability, the real backup script, two negative restore tests
      # (corrupted archive / mismatched checksum - both must be refused untouched), the
      # real restore script, and backend startup against the restored database. All
      # against orszem_drill_*-prefixed Docker resources this step creates and removes
      # itself - see scripts/orszem-restore-drill.sh's own header.
      - name: Run the backup/restore drill
        run: ORSZEM_BACKEND_JAR=backend/build/libs/backend.jar ./scripts/orszem-restore-drill.sh
