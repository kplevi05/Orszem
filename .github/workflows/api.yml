name: api

on:
  push:
    paths: ["services/api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["services/api/**", ".github/workflows/api.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Docker is available on ubuntu-latest runners, so Testcontainers works directly.
      - name: Build & test
        working-directory: services/api
        run: ./gradlew --no-daemon build

  docker-image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t orszem-api:ci .
