name: contract

on:
  push:
    paths: ["contracts/**"]
  pull_request:
    paths: ["contracts/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes @redocly/cli@1.34.2 lint --config contracts/openapi/redocly.yaml contracts/openapi/orszem-v1.yaml
