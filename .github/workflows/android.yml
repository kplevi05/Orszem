name: android

on:
  # Both triggers on purpose. Push covers branches before a PR is opened; pull_request
  # independently verifies every PR, including PRs from forks, which a push trigger in
  # this repository never sees.
  #
  # A branch that already has an open PR therefore runs twice for one commit: push and
  # pull_request use different refs, so the per-ref concurrency group below does not
  # collapse them. That duplication is accepted deliberately - deduplicating by head SHA
  # would make one of the two runs show up on the PR as "cancelled", which is worse than
  # a few extra minutes of CI.
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Only the platform is installed. No build-tools package is pinned: AGP 9.4.0
      # selects its own default (36.0.0), and compileSdk 37 does not imply build-tools 37.
      # The package id is android-37.0 - the SDK repository has no bare android-37, since
      # minor platform releases are 37.0 / 37.1 / 37.2.
      - name: Install SDK platform
        run: sdkmanager "platforms;android-37.0" "platform-tools"

      # Debug only. Release signing is never required in CI and no signing material
      # is available to it.
      - name: Build debug APKs
        working-directory: android
        run: ./gradlew :public-app:assembleDebug :service-app:assembleDebug --no-daemon

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      # Compiles the instrumented tests without running them. They need a real device
      # for the Android Keystore, which is verified locally rather than in CI, but this
      # keeps them from silently rotting as the code around them changes.
      - name: Compile instrumented tests
        working-directory: android
        run: ./gradlew :service-app:assembleDebugAndroidTest --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew lint --no-daemon

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/*/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/*/build/reports/lint-results-debug.html
          retention-days: 7
