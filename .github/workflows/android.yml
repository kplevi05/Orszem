name: android

on:
  push:
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble APKs
        working-directory: apps/android
        run: ./gradlew --no-daemon :public-app:assembleRelease :service-app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            apps/android/public-app/build/outputs/apk/release/*.apk
            apps/android/service-app/build/outputs/apk/release/*.apk
