name: android

on:
  # Every branch. Push-triggered runs attach to the head commit, so they appear as
  # checks on a pull request too - one run per commit instead of two. Add
  # `pull_request:` if outside contributors ever open PRs from forks.
  push:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Only the platform is installed. No build-tools package is pinned: AGP 9.4.0
      # selects its own default (36.0.0), and compileSdk 37 does not imply build-tools 37.
      # The package id is android-37.0 - the SDK repository has no bare android-37, since
      # minor platform releases are 37.0 / 37.1 / 37.2.
      - name: Install SDK platform
        run: sdkmanager "platforms;android-37.0" "platform-tools"

      # Debug only. Release signing is never required in CI and no signing material
      # is available to it.
      - name: Build debug APKs
        working-directory: android
        run: ./gradlew :public-app:assembleDebug :service-app:assembleDebug --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew lint --no-daemon

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/*/build/reports/lint-results-debug.html
          retention-days: 7
